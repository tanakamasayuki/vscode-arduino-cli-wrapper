<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arduino CLI Boards Selector</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 20px;
      line-height: 1.5;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 10px;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    /* Shared style for search text boxes */
    .textbox {
      padding: 8px 10px;
      font-size: 1rem;
    }

    #q {
      flex: 1 1 260px;
    }

    #status {
      font-size: .92rem;
      opacity: .8;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 12px 0 0;
    }

    li {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    li.selected {
      border-color: #007acc;
      background-color: rgba(0, 122, 204, 0.12);
    }

    .name {
      font-weight: 600;
    }

    .fqbn {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      opacity: .9;
    }

    .empty {
      opacity: .7;
      font-style: italic;
    }

    .error {
      color: #b00020;
    }

    .lib-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .lib-name {
      font-weight: 600;
    }

    .lib-version-select {
      min-width: 120px;
    }

    .lib-repo-link {
      font-size: .9rem;
    }

    .platform-version-select {
      min-width: 140px;
    }

    .platform-version-status {
      font-size: .9rem;
      opacity: .8;
    }
  </style>
  <!-- Catalog retrieval and YAML edits are handled by the extension host. -->
</head>

<body>
  <div class="controls">
    <input id="q" class="textbox" type="search" placeholder="Filter (name or FQBN)" autocomplete="off" />
    <div id="status">Loading...</div>
  </div>
  <ul id="list" aria-live="polite"></ul>
  <div id="config" style="margin-top:16px;"></div>
  <div id="summaryBottom" class="fqbn" style="margin-top:24px; padding-top:8px; border-top:1px solid #ccc;"></div>

  <script>
    (function () {
      'use strict';
      let requestId = 0;
      const pendingRequests = new Map();
      function requestTool(action, payload = {}) {
        return new Promise((resolve, reject) => {
          const id = ++requestId;
          const timer = setTimeout(() => { pendingRequests.delete(id); reject(new Error('Request timed out')); }, 45000);
          pendingRequests.set(id, { resolve, reject, timer });
          try { getVsCodeApi().postMessage({ type: 'sketchToolRequest', id, action, payload }); }
          catch (error) { clearTimeout(timer); pendingRequests.delete(id); reject(error); }
        });
      }
      window.addEventListener('message', event => {
        const message = event.data;
        if (message?.type !== 'sketchToolResponse') return;
        const request = pendingRequests.get(message.id);
        if (!request) return;
        clearTimeout(request.timer); pendingRequests.delete(message.id);
        if (message.error) request.reject(new Error(message.error)); else request.resolve(message.result);
      });
      // Initialize profile context before rendering catalog controls.
      const catalogs = requestTool('initialize').then(initial => {
        window.dispatchEvent(new MessageEvent('message', { data: initial }));
        return requestTool('catalogs');
      });
      const q = document.getElementById('q');
      const status = document.getElementById('status');
      const list = document.getElementById('list');
      const IS_JA_LOCALE = ((document.documentElement.dataset.vscodeLanguage || navigator.language || '').toLowerCase().startsWith('ja'));
      const MAX_BOARD_RESULTS = 50;
      const BOARD_REFINE_LABEL = IS_JA_LOCALE ? 'さらに絞り込んでください' : 'Refine the filter to narrow further';
      const BOARD_NO_RESULTS = IS_JA_LOCALE ? '該当なし' : 'No results';
      const BOARD_EXACT_LABEL = IS_JA_LOCALE ? '完全一致' : 'exact match';
      let skipNextBoardClick = false;

      /** @type {{fqbn:string,name:string,search:string}[]} */
      let boardEntries = [];
      /** @type {Record<string, {name?:string, version?:string, config_options?: any[], package_url?: string}>} */
      let dataMap = {};
      /** @type {Array<any>|null} */
      let libsCache = null;
      /** @type {Map<string,string|true>} */
      const selectedLibs = new Map();
      /** @type {Array<{key:string,val:string}>|null} */
      window.__OPT_PAIRS = null; // pairs parsed from extFqbn (key=value)
      // Defer any YAML templating until init message arrives with profile block
      try { window.__INIT_PENDING__ = true; window.__USER_CHANGED_OPTIONS__ = false; } catch (_) { }

      const VERSION_COLLATOR = (function () {
        try { return new Intl.Collator('en', { numeric: true, sensitivity: 'base' }); } catch (_) { return null; }
      })();

      function sortVersionsDesc(list) {
        if (!Array.isArray(list) || list.length === 0) return [];
        const arr = list.slice();
        if (VERSION_COLLATOR) arr.sort((a, b) => VERSION_COLLATOR.compare(b, a));
        else arr.sort((a, b) => String(b).localeCompare(String(a)));
        return arr;
      }

      function dedupePreserveOrder(list) {
        if (!Array.isArray(list)) return [];
        const seen = new Set();
        const out = [];
        list.forEach((val) => {
          const key = String(val || '').trim();
          if (!key || seen.has(key)) return;
          seen.add(key);
          out.push(key);
        });
        return out;
      }

      function fetchPlatformVersions(platformId, indexUrl) {
        return requestTool('platformVersions', { platformId, indexUrl }).then(result => result.versions);
      }

      function setStatus(text, isError = false) {
        status.textContent = text;
        status.className = isError ? 'error' : '';
      }

      function render(data) {
        dataMap = data || {};
        const entries = Object.entries(dataMap).map(([fqbn, detail]) => ({
          fqbn,
          name: (detail && typeof detail.name === 'string') ? detail.name : '',
          detail: detail || null,
        }));
        entries.sort((a, b) => a.name.localeCompare(b.name, 'en'));
        list.innerHTML = '';
        boardEntries = entries.map(({ fqbn, name, detail }) => ({
          fqbn,
          name,
          detail,
          search: (fqbn + ' ' + name).toLowerCase(),
        }));
        setStatus(boardEntries.length ? (IS_JA_LOCALE ? `${boardEntries.length}件` : `${boardEntries.length} items`) : BOARD_NO_RESULTS);
      }

      function selectBoard(fqbn, detail) {
        try { window.__USER_CHANGED_OPTIONS__ = true; window.__INIT_PENDING__ = false; } catch (_) { }
        try { window.__CURRENT_SELECTED_FQBN__ = fqbn; } catch (_) { }
        q.value = fqbn;
        applyFilter(fqbn, detail || null);
      }

      function applyFilter(forcedFqbn = null, forcedDetail = null) {
        const rawNeedle = (forcedFqbn || q.value || '').trim();
        const needle = rawNeedle.toLowerCase();
        let exact = forcedFqbn || (rawNeedle && Object.prototype.hasOwnProperty.call(dataMap, rawNeedle) ? rawNeedle : null);
        if (!exact && rawNeedle) {
          const parts = rawNeedle.split(':');
          if (parts.length >= 4) {
            const base = parts.slice(0, 3).join(':');
            if (Object.prototype.hasOwnProperty.call(dataMap, base)) {
              exact = base;
            }
          }
        }

        const matches = (() => {
          if (!needle) return boardEntries.slice();
          if (exact) return boardEntries.filter(entry => entry.fqbn === exact);
          return boardEntries.filter(entry => entry.search.includes(needle));
        })();

        list.innerHTML = '';
        const limited = matches.slice(0, MAX_BOARD_RESULTS);
        limited.forEach((entry) => {
          const li = document.createElement('li');
          const nameEl = document.createElement('div');
          nameEl.className = 'name';
          nameEl.textContent = entry.name || '(No name)';
          const fqbnEl = document.createElement('div');
          fqbnEl.className = 'fqbn';
          fqbnEl.textContent = entry.fqbn;
          li.appendChild(nameEl);
          li.appendChild(fqbnEl);
          if (exact && entry.fqbn === exact) li.classList.add('selected');
          li.addEventListener('mousedown', (ev) => {
            if (ev.button !== 0) return;
            skipNextBoardClick = true;
            ev.preventDefault();
            selectBoard(entry.fqbn, entry.detail || null);
            setTimeout(() => { skipNextBoardClick = false; }, 200);
          });
          li.addEventListener('click', () => {
            if (skipNextBoardClick) {
              skipNextBoardClick = false;
              return;
            }
            selectBoard(entry.fqbn, entry.detail || null);
          });
          list.appendChild(li);
        });

        const totalMatches = matches.length;
        const shown = limited.length;

        let detailForExact = forcedDetail || null;
        if (!detailForExact && exact) {
          const fromMap = dataMap[exact];
          if (fromMap) detailForExact = fromMap;
          else {
            const foundEntry = matches.find(entry => entry.fqbn === exact);
            if (foundEntry && foundEntry.detail) detailForExact = foundEntry.detail;
          }
        }

        if (!needle) {
          if (totalMatches === 0) {
            setStatus(BOARD_NO_RESULTS);
          } else if (totalMatches > MAX_BOARD_RESULTS) {
            setStatus(IS_JA_LOCALE ? `${shown}件を表示 / 全${totalMatches}件 (${BOARD_REFINE_LABEL})` : `Showing ${shown} / ${totalMatches} items (${BOARD_REFINE_LABEL})`);
          } else {
            setStatus(IS_JA_LOCALE ? `${totalMatches}件` : `${totalMatches} items`);
          }
          renderConfig(null, null);
          return;
        }

        if (exact) {
          setStatus(shown ? (IS_JA_LOCALE ? `${shown}件 (${BOARD_EXACT_LABEL})` : `${shown} item(s) (${BOARD_EXACT_LABEL})`) : BOARD_NO_RESULTS);
          try {
            window.__INIT_PENDING__ = false;
            if (!window.__CURRENT_BASEFQBN__) window.__CURRENT_BASEFQBN__ = exact;
            if (!window.__CURRENT_EXTFQBN__) window.__CURRENT_EXTFQBN__ = exact;
          } catch (_) { }
          renderConfig(exact, detailForExact || null);
          return;
        }

        if (totalMatches === 0) {
          setStatus(BOARD_NO_RESULTS);
          renderConfig(null, null);
          return;
        }

        if (totalMatches > MAX_BOARD_RESULTS) {
          setStatus(IS_JA_LOCALE ? `${shown}件を表示 / 全${totalMatches}件 (${BOARD_REFINE_LABEL})` : `Showing ${shown} / ${totalMatches} items (${BOARD_REFINE_LABEL})`);
        } else {
          setStatus(IS_JA_LOCALE ? `${totalMatches}件 / 全${boardEntries.length}件` : `${totalMatches} / ${boardEntries.length} items`);
        }
        renderConfig(null, null);
      }

      // VS Code API getter: acquire exactly once to avoid errors
      function getVsCodeApi() {
        try {
          if (window.__VSCODE_API__) return window.__VSCODE_API__;
          if (typeof acquireVsCodeApi === 'function') {
            window.__VSCODE_API__ = acquireVsCodeApi();
            return window.__VSCODE_API__;
          }
        } catch (_) { /* ignore */ }
        return null;
      }

      function renderConfig(fqbn, detail) {
        const root = document.getElementById('config');
        const previousYaml = root.querySelector('#yamlBox');
        if (previousYaml) window.__WORKING_YAML__ = previousYaml.value;
        root.innerHTML = '';
        const summaryBottom = document.getElementById('summaryBottom');
        summaryBottom.textContent = '';
        if (!fqbn) return;
        const resolvedDetail = detail || dataMap[fqbn] || null;
        if (!resolvedDetail) return;
        detail = resolvedDetail;
        const previousBoard = String(window.__CURRENT_BASEFQBN__ || '');
        if (previousBoard && previousBoard !== fqbn) {
          // Keep the existing workflow: choosing another board prepares an additional profile.
          window.__WORKING_YAML__ = '';
          window.__INITIAL_PROFILE_BLOCK__ = '';
          window.__PROFILE_NAME__ = '';
          window.__ALLOW_LIB_PATCH__ = true;
          window.__CORE_VERSION_USER_CHANGED__ = false;
          window.__CURRENT_EXTFQBN__ = fqbn;
          window.__INIT_STATE__ = { platformId: fqbn.split(':').slice(0, 2).join(':'), platformVersion: detail.version || '' };
          window.__INIT_PLATFORM_INDEX_URL__ = detail.package_url || '';
        }
        window.__CURRENT_BASEFQBN__ = fqbn;
        const isJa = (document.documentElement.dataset.vscodeLanguage || navigator.language || '').toLowerCase().startsWith('ja');

        const title = document.createElement('h2');
        title.style.fontSize = '1.1rem';
        title.textContent = `Config Options: ${detail.name || ''} (${fqbn})`;
        root.appendChild(title);

        const platformIdForBoard = (function () {
          const parts = String(fqbn || '').split(':');
          return parts.length >= 2 ? `${parts[0]}:${parts[1]}` : String(fqbn || '');
        })();
        // Package URL (show above FQBN summary, no link)
        const initialPlatformIndexUrl = (function () {
          try { return (typeof window.__INIT_PLATFORM_INDEX_URL__ === 'string') ? window.__INIT_PLATFORM_INDEX_URL__ : ''; } catch (_) { return ''; }
        })();
        const storedPlatformStateId = (function () {
          try {
            const state = window.__INIT_STATE__;
            return state && state.platformId ? String(state.platformId) : '';
          } catch (_) { return ''; }
        })();
        const pkgUrlSource = (storedPlatformStateId && storedPlatformStateId === platformIdForBoard && initialPlatformIndexUrl) ? initialPlatformIndexUrl : '';
        const pkgUrl = pkgUrlSource || ((detail && typeof detail.package_url === 'string') ? detail.package_url : '');
        try { window.__INIT_PLATFORM_INDEX_URL__ = pkgUrl; } catch (_) { }
        if (pkgUrl) {
          const p = document.createElement('div');
          p.style.margin = '4px 0 8px';
          p.textContent = (isJa ? 'プラットフォームインデックス URL: ' : 'Platform index URL: ') + pkgUrl;
          root.appendChild(p);
        }

        // Summary shown just before options (below package URL)
        const summaryTop = document.createElement('div');
        summaryTop.className = 'fqbn';
        summaryTop.style.margin = '8px 0';
        root.appendChild(summaryTop);

        const platformVersionWrap = document.createElement('div');
        platformVersionWrap.style.margin = '8px 0';
        platformVersionWrap.style.display = 'flex';
        platformVersionWrap.style.alignItems = 'center';
        platformVersionWrap.style.gap = '8px';
        platformVersionWrap.style.flexWrap = 'wrap';
        const platformVersionLabel = document.createElement('div');
        platformVersionLabel.textContent = isJa ? 'プラットフォームバージョン' : 'Platform version';
        platformVersionLabel.style.fontWeight = '600';
        platformVersionWrap.appendChild(platformVersionLabel);
        const platformVersionSelect = document.createElement('select');
        platformVersionSelect.className = 'platform-version-select';
        platformVersionSelect.disabled = true;
        platformVersionWrap.appendChild(platformVersionSelect);
        const platformVersionFetchBtn = document.createElement('button');
        platformVersionFetchBtn.type = 'button';
        platformVersionFetchBtn.textContent = isJa ? 'バージョン一覧を取得' : 'Fetch versions';
        platformVersionWrap.appendChild(platformVersionFetchBtn);
        const platformVersionStatus = document.createElement('span');
        platformVersionStatus.className = 'platform-version-status';
        platformVersionWrap.appendChild(platformVersionStatus);
        root.appendChild(platformVersionWrap);

        const setPlatformVersionStatus = (text, isError = false) => {
          platformVersionStatus.textContent = text || '';
          platformVersionStatus.style.color = isError ? '#b00020' : '';
        };

        // YAML output UI (placed above options)
        const yamlWrap = document.createElement('div');
        yamlWrap.style.margin = '12px 0';
        const yamlLabel = document.createElement('div');
        yamlLabel.textContent = 'sketch.yaml (template)';
        yamlLabel.style.fontWeight = '600';
        yamlLabel.style.margin = '8px 0 4px';
        const yamlBox = document.createElement('textarea');
        yamlBox.id = 'yamlBox';
        yamlBox.rows = 15;
        yamlBox.style.width = '100%';
        yamlBox.style.fontFamily = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
        yamlBox.style.tabSize = '2';
        yamlWrap.appendChild(yamlLabel);
        // Mismatch panel above textarea
        const mismatchPanel = document.createElement('div');
        mismatchPanel.style.margin = '4px 0 8px';
        mismatchPanel.style.display = 'none';
        const mmHeader = document.createElement('div');
        mmHeader.style.fontWeight = '600';
        const mmList = document.createElement('div');
        mmList.id = 'mismatchList';
        mmList.style.fontFamily = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
        mmList.style.whiteSpace = 'pre-wrap';
        mmList.style.margin = '4px 0';
        const mmBtn = document.createElement('button');
        mmBtn.type = 'button';
        mmBtn.disabled = true;
        mismatchPanel.appendChild(mmHeader);
        mismatchPanel.appendChild(mmList);
        mismatchPanel.appendChild(mmBtn);
        yamlWrap.appendChild(mismatchPanel);
        const dlBtn = document.createElement('button');
        dlBtn.type = 'button';
        dlBtn.style.margin = '0 0 8px 0';
        const vscode = getVsCodeApi();
        if (vscode) {
          dlBtn.textContent = isJa ? 'sketch.yaml に反映' : 'Apply to sketch.yaml';
          dlBtn.addEventListener('click', () => {
            const content = yamlBox.value || '';
            if (content) vscode.postMessage({ type: 'applyYaml', yaml: content, pinUnversioned: !!window.__CORE_VERSION_USER_CHANGED__ && !!selectedPlatformVersion });
          });
        } else {
          dlBtn.textContent = 'Download sketch.yaml';
          dlBtn.addEventListener('click', () => {
            const content = yamlBox.value || '';
            const blob = new Blob([content], { type: 'text/yaml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'sketch.yaml';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
          });
        }
        yamlWrap.appendChild(dlBtn);
        yamlWrap.appendChild(yamlBox);
        root.appendChild(yamlWrap);

        // If there is an initial profile block (from existing sketch.yaml), inject it immediately
        // to avoid showing a temporary template and to preserve unknown keys like `note`.
        try {
          const initialBlock = String(window.__INITIAL_PROFILE_BLOCK__ || '');
          const profNameHint = String(window.__PROFILE_NAME__ || '');
          if (window.__WORKING_YAML__ !== undefined) {
            yamlBox.value = window.__WORKING_YAML__;
          } else if (initialBlock.trim()) {
            const wrapped = 'profiles:\n' + initialBlock.replace(/\s+$/, '') + '\n\n' + (profNameHint ? ('default_profile: ' + profNameHint + '\n') : '');
            yamlBox.value = wrapped;
            window.__KEEP_EXISTING_YAML__ = true;
            // Avoid patching libraries until the user explicitly changes selection
            window.__ALLOW_LIB_PATCH__ = false;
            // Update FQBN summaries to ext, but do not rebuild YAML
            try { summaryTop.textContent = extFqbn || fqbn; summaryBottom.textContent = extFqbn || fqbn; } catch (_) { }
          }
        } catch (_) { }

        const opts = Array.isArray(detail.config_options) ? detail.config_options : [];
        const currentFqbn = String(window.__CURRENT_EXTFQBN__ || window.__INIT_EXTFQBN__ || '');
        const configuredOptions = new Map(currentFqbn.split(':').slice(0, 3).join(':') === fqbn
          ? currentFqbn.split(':').slice(3).join(':').split(',').filter(Boolean).map(pair => { const at = pair.indexOf('='); return [pair.slice(0, at), pair.slice(at + 1)]; }) : []);
        if (!opts.length) {
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = 'This board has no config_options.';
          root.appendChild(p);
          // Show base FQBN in both places even without options
          summaryTop.textContent = `${fqbn}`;
          summaryBottom.textContent = `${fqbn}`;
          // Note: do NOT return here so that mismatch panel
          // and the update button are still active and can
          // update the YAML template (e.g., platform version).
        }

        const groups = [];
        let previewSequence = 0;
        let mismatchSequence = 0;
        const changedOptionKeys = new Set();
        // Track selected platform version; prefer version from sketch.yaml init if provided and matching this board
        let selectedPlatformVersion = (function () {
          const defaultVer = (detail && typeof detail.version === 'string' && detail.version) ? detail.version : '';
          try {
            const init = window.__INIT_STATE__ || {};
            const initId = init.platformId || '';
            const initVer = init.platformVersion || '';
            if (initId && initId === platformIdForBoard) return initVer;
          } catch (_) { }
          return defaultVer;
        })();
        try { window.__INIT_STATE__ = { platformId: platformIdForBoard, platformVersion: selectedPlatformVersion || '' }; } catch (_) { }
        const metadataNote = document.createElement('p');
        metadataNote.className = 'small';
        function refreshMetadataNote() {
          metadataNote.textContent = detail.boardVersion && detail.boardVersion !== selectedPlatformVersion
            ? String(window.__METADATA_WARNING__ || '').replace('{catalog}', detail.boardVersion).replace('{configured}', selectedPlatformVersion || window.__LOCAL_CORE_LABEL__ || '') : '';
        }
        refreshMetadataNote(); root.appendChild(metadataNote);
        function syncPlatformVersionToState(patchYaml) {
          try {
            const state = window.__INIT_STATE__ = window.__INIT_STATE__ || {};
            state.platformId = platformIdForBoard;
            state.platformVersion = selectedPlatformVersion || '';
          } catch (_) { }
          updateSummary();
          updateMismatches(); refreshMetadataNote();
        }
        let platformVersionLoaded = false;
        let platformVersionLoading = false;

        function resetPlatformVersionOptions(current) {
          platformVersionSelect.innerHTML = '';
          const autoOpt = document.createElement('option');
          autoOpt.value = '';
          autoOpt.disabled = !!selectedPlatformVersion;
          autoOpt.textContent = window.__LOCAL_CORE_LABEL__ || (isJa ? '版指定なし（ローカル開発用）' : 'Unversioned (local development)');
          platformVersionSelect.appendChild(autoOpt);
          if (current) {
            const opt = document.createElement('option');
            opt.value = current;
            opt.textContent = current;
            platformVersionSelect.appendChild(opt);
            platformVersionSelect.value = current;
          } else {
            platformVersionSelect.value = '';
          }
        }

        function initPlatformVersionSelect() {
          if (!platformIdForBoard) {
            platformVersionSelect.disabled = true;
            platformVersionFetchBtn.disabled = true;
            platformVersionSelect.innerHTML = '';
            setPlatformVersionStatus(isJa ? 'プラットフォーム ID が未設定です' : 'Platform id unavailable', true);
            return;
          }
          const current = (selectedPlatformVersion || '').trim();
          resetPlatformVersionOptions(current);
          platformVersionSelect.disabled = false;
          platformVersionFetchBtn.disabled = false;
          platformVersionFetchBtn.textContent = isJa ? 'バージョン一覧を取得' : 'Fetch versions';
          platformVersionLoaded = false;
          setPlatformVersionStatus(isJa ? '「バージョン一覧を取得」で候補を表示します' : 'Click "Fetch versions" to list available versions', false);
          syncPlatformVersionToState(false);
        }

        function loadPlatformVersions(force) {
          if (!platformIdForBoard) return;
          if (platformVersionLoading) return;
          if (platformVersionLoaded && !force) return;
          const current = (selectedPlatformVersion || '').trim();
          platformVersionLoading = true;
          platformVersionFetchBtn.disabled = true;
          platformVersionSelect.disabled = true;
          setPlatformVersionStatus(isJa ? '読み込み中…' : 'Loading…', false);
          fetchPlatformVersions(platformIdForBoard, pkgUrl)
            .then((versions) => {
              platformVersionLoaded = true;
              const versionSet = new Set(versions || []);
              platformVersionSelect.innerHTML = '';
              const autoOpt = document.createElement('option');
              autoOpt.value = '';
              autoOpt.disabled = !!selectedPlatformVersion;
              autoOpt.textContent = window.__LOCAL_CORE_LABEL__ || (isJa ? '版指定なし（ローカル開発用）' : 'Unversioned (local development)');
              platformVersionSelect.appendChild(autoOpt);
              const ordered = dedupePreserveOrder(Array.isArray(versions) ? versions : []);
              if (current && !versionSet.has(current)) ordered.unshift(current);
              ordered.forEach((ver) => {
                const opt = document.createElement('option');
                opt.value = ver;
                opt.textContent = ver + (!versionSet.has(ver) && ver === current ? (isJa ? ' (sketch.yaml)' : ' (sketch.yaml)') : '');
                platformVersionSelect.appendChild(opt);
              });
              platformVersionSelect.value = current || '';
              if (platformVersionSelect.value !== (current || '')) {
                platformVersionSelect.value = '';
              }
              selectedPlatformVersion = platformVersionSelect.value || '';
              if (versions && versions.length) {
                setPlatformVersionStatus('', false);
              } else {
                setPlatformVersionStatus(isJa ? 'バージョンが見つかりませんでした' : 'No versions found', false);
              }
            })
            .catch(() => {
              platformVersionLoaded = false;
              resetPlatformVersionOptions(current);
              setPlatformVersionStatus(isJa ? 'バージョン一覧の取得に失敗しました' : 'Failed to fetch versions', true);
            })
            .finally(() => {
              platformVersionLoading = false;
              platformVersionSelect.disabled = false;
              platformVersionFetchBtn.disabled = false;
              if (platformVersionLoaded) {
                platformVersionFetchBtn.textContent = isJa ? 'バージョン一覧を再取得' : 'Refresh versions';
              }
              syncPlatformVersionToState(false);
            });
        }

        platformVersionSelect.addEventListener('change', () => {
          selectedPlatformVersion = platformVersionSelect.value || '';
          window.__CORE_VERSION_USER_CHANGED__ = true;
          try { window.__USER_CHANGED_OPTIONS__ = true; } catch (_) { }
          syncPlatformVersionToState(true);
        });

        platformVersionSelect.addEventListener('focus', () => {
          if (!platformVersionLoaded && !platformVersionLoading) {
            loadPlatformVersions(false);
          }
        });

        platformVersionFetchBtn.addEventListener('click', () => {
          loadPlatformVersions(true);
        });

        initPlatformVersionSelect();
        opts.forEach((opt, idx) => {
          const groupName = `opt_${idx}`;
          const fs = document.createElement('fieldset');
          fs.style.margin = '12px 0';
          const legend = document.createElement('legend');
          const optionKey = (opt && (opt.option || opt.id || `option_${idx + 1}`));
          const optionLabel = (opt && (opt.option_label || opt.label || optionKey));
          legend.textContent = String(optionLabel);
          fs.appendChild(legend);

          const values = (opt && Array.isArray(opt.values)) ? opt.values : [];
          // Determine default index (prefer is_default; fallback to 0)
          let defaultIdx = 0;
          for (let j = 0; j < values.length; j++) {
            if (values[j] && values[j].is_default) { defaultIdx = j; break; }
          }
          values.forEach((v, j) => {
            const id = `${groupName}_${j}`;
            const wrap = document.createElement('div');
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = groupName;
            input.id = id;
            const valText = (v && (v.value ?? v.id ?? v.label ?? '')) + '';
            const valLabel = (v && (v.value_label ?? v.label ?? valText)) + '';
            input.value = valText;
            if (configuredOptions.has(String(optionKey)) ? configuredOptions.get(String(optionKey)) === valText : j === defaultIdx) input.checked = true;
            input.dataset.groupIndex = String(idx);
            input.dataset.index = String(j);
            input.dataset.option = String(optionKey);
            input.dataset.valText = valText;
            const lab = document.createElement('label');
            lab.htmlFor = id;
            lab.textContent = valLabel + (v && v.is_default ? ' (default)' : '');
            wrap.appendChild(input);
            wrap.appendChild(lab);
            fs.appendChild(wrap);
          });

          // If none default, select first for clarity
          if (!fs.querySelector('input[type="radio"]:checked')) {
            const first = fs.querySelector('input[type="radio"]');
            if (first) first.checked = true;
          }

          // Store default index on fieldset for later comparisons
          fs.dataset.defaultIndex = String(defaultIdx);

          root.appendChild(fs);
          groups.push(fs);
        });

        function toSlug(s) {
          return (s || '').toLowerCase().replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '') || 'default';
        }
        async function updateSummary() {
          if (window.__INIT_PENDING__) return;
          const originalFqbn = String(window.__CURRENT_EXTFQBN__ || window.__INIT_EXTFQBN__ || '');
          const sameBoard = originalFqbn.split(':').slice(0, 3).join(':') === fqbn;
          const pairs = new Map(sameBoard ? originalFqbn.split(':').slice(3).join(':').split(',').filter(Boolean).map(pair => { const at = pair.indexOf('='); return [pair.slice(0, at), pair.slice(at + 1)]; }) : []);
          groups.forEach(group => {
            const selected = group.querySelector('input[type="radio"]:checked');
            if (!selected) return;
            const key = selected.dataset.option;
            // Keep configured defaults and values absent from this catalog until explicitly changed.
            if (sameBoard && pairs.has(key) && !changedOptionKeys.has(key)) return;
            if (Number(selected.dataset.index) !== Number(group.dataset.defaultIndex) || pairs.has(key)) pairs.set(key, selected.dataset.valText);
          });
          const extended = fqbn + (pairs.size ? ':' + [...pairs].map(([key, value]) => `${key}=${value}`).join(',') : '');
          window.__CURRENT_EXTFQBN__ = extended;
          summaryTop.textContent = extended; summaryBottom.textContent = extended;
          const profile = String(window.__PROFILE_NAME__ || toSlug(fqbn.split(':')[2]));
          const captured = yamlBox.value;
          const sequence = ++previewSequence;
          dlBtn.disabled = true;
          try {
            const content = await requestTool('preview', { text: captured, profile, fqbn: extended,
              version: selectedPlatformVersion, indexUrl: pkgUrl,
              libraries: [...selectedLibs].map(([name, version]) => ({ name, version })),
              updateLibraries: !!window.__ALLOW_LIB_PATCH__,
              pinUnversioned: !!window.__CORE_VERSION_USER_CHANGED__ && !!selectedPlatformVersion });
            if (sequence !== previewSequence || !yamlBox.isConnected) return;
            if (yamlBox.value === captured) { yamlBox.value = content; window.__WORKING_YAML__ = content; }
            dlBtn.disabled = false; updateMismatches();
          } catch (error) {
            if (sequence === previewSequence && yamlBox.isConnected) setStatus(error.message, true);
          }
        }
        yamlBox.addEventListener('input', () => {
          // Manual edits remain authoritative; final apply validates them through the module.
          ++previewSequence; window.__WORKING_YAML__ = yamlBox.value; dlBtn.disabled = false;
        });

        // Hook change events
        groups.forEach((fs) => {
          fs.addEventListener('change', event => {
            changedOptionKeys.add(event.target.dataset.option);
            try {
              // Ignore synthetic changes during init
              if (window.__INIT_PENDING__) { updateSummary(); return; }
              window.__USER_CHANGED_OPTIONS__ = true;
            } catch (_) { }
            updateSummary();
          });
        });

        // Libraries UI (under options)
        const libsWrap = document.createElement('div');
        libsWrap.style.margin = '12px 0';
        const libsHeader = document.createElement('div');
        libsHeader.textContent = 'Libraries';
        libsHeader.style.fontWeight = '600';
        libsHeader.style.margin = '8px 0 4px';
        const libsControls = document.createElement('div');
        libsControls.className = 'controls';
        const libsQ = document.createElement('input');
        libsQ.type = 'search';
        libsQ.placeholder = 'Filter libraries (partial match)';
        libsQ.autocomplete = 'off';
        libsQ.className = 'textbox';
        libsQ.style.flex = '1 1 260px';
        const libsStatus = document.createElement('div');
        libsStatus.id = 'libsStatus';
        libsStatus.style.fontSize = '.92rem';
        libsStatus.style.opacity = '.8';
        libsStatus.textContent = 'Loading...';
        libsControls.appendChild(libsQ);
        const onlySel = document.createElement('input');
        onlySel.type = 'checkbox';
        onlySel.id = 'onlySelected';
        onlySel.style.marginLeft = '8px';
        const onlySelLabel = document.createElement('label');
        onlySelLabel.htmlFor = 'onlySelected';
        onlySelLabel.textContent = 'Only selected';
        onlySelLabel.style.marginLeft = '4px';
        libsControls.appendChild(onlySel);
        libsControls.appendChild(onlySelLabel);
        libsControls.appendChild(libsStatus);
        const libsList = document.createElement('ul');
        libsList.id = 'libsList';
        libsList.style.marginTop = '8px';
        libsWrap.appendChild(libsHeader);
        libsWrap.appendChild(libsControls);
        libsWrap.appendChild(libsList);
        root.appendChild(libsWrap);

        function libName(row) { return (row.name || row.Title || row.title || row.Library || '').toString(); }
        function libVersion(row) { return (row.version || row.Version || row.library_version || '').toString(); }
        function libVersions(row) {
          const list = [];
          const seen = new Set();
          const pushUnique = (val) => {
            const str = (val === undefined || val === null) ? '' : String(val).trim();
            if (!str || seen.has(str)) return;
            seen.add(str);
            list.push(str);
          };
          pushUnique(libVersion(row));
          const raw = row && row.versions;
          if (Array.isArray(raw)) {
            raw.forEach(pushUnique);
          } else if (typeof raw === 'string') {
            raw.split(',').forEach(pushUnique);
          }
          return list;
        }
        function libRepositoryUrl(row) {
          if (!row || typeof row !== 'object') return '';
          const candidates = [row.repository, row.website, row.url];
          for (const item of candidates) {
            if (typeof item === 'string') {
              const trimmed = item.trim();
              if (trimmed) return trimmed;
            }
          }
          return '';
        }

        function findLibraryRowByName(targetName) {
          if (!Array.isArray(libsCache)) return null;
          const wanted = String(targetName || '');
          for (const row of libsCache) {
            if (libName(row) === wanted) return row;
          }
          return null;
        }
        function extractDependencyNames(row) {
          if (!row || typeof row !== 'object') return [];
          const deps = Array.isArray(row.dependencies) ? row.dependencies : [];
          const names = [];
          for (const entry of deps) {
            let depName = '';
            if (typeof entry === 'string') {
              depName = entry;
            } else if (entry && typeof entry === 'object') {
              if (typeof entry.name === 'string') depName = entry.name;
              else if (typeof entry.library === 'string') depName = entry.library;
              else if (typeof entry.id === 'string') depName = entry.id;
            }
            depName = typeof depName === 'string' ? depName.trim() : '';
            if (depName) names.push(depName);
          }
          return names;
        }
        function addDependenciesForSelection(rootName) {
          const root = String(rootName || '').trim();
          if (!root) return false;
          const visited = new Set();
          const stack = [root];
          let added = false;
          while (stack.length > 0) {
            const current = stack.pop();
            if (visited.has(current)) continue;
            visited.add(current);
            const row = findLibraryRowByName(current);
            if (!row) continue;
            const depNames = extractDependencyNames(row);
            for (const depName of depNames) {
              if (!depName || depName === current) continue;
              if (!visited.has(depName)) stack.push(depName);
              if (!selectedLibs.has(depName)) {
                const depRow = findLibraryRowByName(depName);
                const depVer = depRow ? libVersion(depRow) : '';
                selectedLibs.set(depName, depVer ? depVer : '');
                added = true;
              }
            }
          }
          return added;
        }
        function renderLibs() {
          libsList.innerHTML = '';
          if (!Array.isArray(libsCache)) { libsStatus.textContent = isJa ? '読み込みエラー' : 'Load error'; return; }
          const repoLabel = isJa ? 'リポジトリ' : 'Repository';
          const latestLabel = isJa ? '最新' : 'Latest';
          const unknownLabel = isJa ? '名称不明のライブラリ' : '(Unknown library)';
          const versionAriaFallback = isJa ? 'ライブラリのバージョン' : 'Library version';
          const refineLabel = isJa ? 'さらに絞り込んでください' : 'Refine the filter to narrow further';
          const MAX_LIB_RESULTS = 50;
          // No implicit default library selection; respect only provided/selected libraries
          const term = libsQ.value.trim().toLowerCase();
          let renderedCount = 0;
          let hasMoreMatches = false;
          for (let idx = 0; idx < libsCache.length; idx++) {
            const row = libsCache[idx];
            const name = libName(row);
            const ver = libVersion(row);
            const versionsList = libVersions(row);
            const text = (name + ' ' + ver + ' ' + versionsList.join(' ')).toLowerCase();
            if (term && !text.includes(term)) continue;
            if (onlySel.checked && !selectedLibs.has(name)) continue;
            if (renderedCount >= MAX_LIB_RESULTS) {
              hasMoreMatches = true;
              break;
            }
            const li = document.createElement('li');
            const rowWrap = document.createElement('div');
            rowWrap.className = 'lib-row';
            li.appendChild(rowWrap);
            const id = 'lib_' + idx;
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.id = id;
            cb.checked = selectedLibs.has(name);
            const lab = document.createElement('label');
            lab.className = 'lib-name';
            lab.htmlFor = id;
            lab.textContent = name || unknownLabel;
            const storedVersion = selectedLibs.has(name) ? (selectedLibs.get(name) || '') : '';
            if (storedVersion && !versionsList.includes(storedVersion)) versionsList.push(storedVersion);
            let currentVersion = storedVersion || (versionsList[0] || ver || '');
            const select = document.createElement('select');
            select.className = 'lib-version-select';
            select.setAttribute('aria-label', (name ? (isJa ? `${name} のバージョン` : `${name} version`) : versionAriaFallback));
            if (versionsList.length > 0) {
              versionsList.forEach((v) => {
                const opt = document.createElement('option');
                opt.value = v;
                opt.textContent = v;
                select.appendChild(opt);
              });
            } else {
              const opt = document.createElement('option');
              opt.value = ver || '';
              opt.textContent = ver || latestLabel;
              select.appendChild(opt);
              currentVersion = ver || '';
            }
            if (currentVersion) {
              let matched = false;
              for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].value === currentVersion) { matched = true; break; }
              }
              if (matched) {
                select.value = currentVersion;
              } else if (select.options.length > 0) {
                currentVersion = select.options[0].value;
                select.value = currentVersion;
              }
            } else if (select.options.length > 0) {
              currentVersion = select.options[0].value;
              select.value = currentVersion;
            }
            const repoUrl = libRepositoryUrl(row);
            cb.addEventListener('change', () => {
              let needsRefresh = false;
              if (cb.checked) {
                const versionForSelection = select.value || currentVersion || ver || '';
                selectedLibs.set(name, versionForSelection);
                currentVersion = versionForSelection;
                const added = addDependenciesForSelection(name);
                if (added) needsRefresh = true;
              } else {
                selectedLibs.delete(name);
              }
              try { window.__ALLOW_LIB_PATCH__ = true; } catch (_) { }
              updateSummary();
              try { updateMismatches(); } catch (_) { }
              if (needsRefresh) {
                setTimeout(() => {
                  renderLibs();
                  updateSummary();
                }, 0);
              }
            });
            select.addEventListener('change', () => {
              currentVersion = select.value || '';
              if (selectedLibs.has(name)) {
                selectedLibs.set(name, currentVersion);
                try { window.__ALLOW_LIB_PATCH__ = true; } catch (_) { }
                updateSummary();
                try { updateMismatches(); } catch (_) { }
              }
            });
            rowWrap.appendChild(cb);
            rowWrap.appendChild(lab);
            rowWrap.appendChild(select);
            if (repoUrl) {
              const repoLink = document.createElement('a');
              repoLink.href = repoUrl;
              repoLink.target = '_blank';
              repoLink.rel = 'noopener';
              repoLink.textContent = repoLabel;
              repoLink.className = 'lib-repo-link';
              repoLink.style.marginLeft = 'auto';
              rowWrap.appendChild(repoLink);
            }
            libsList.appendChild(li);
            renderedCount++;
          }
          if (renderedCount === 0 && !hasMoreMatches) {
            libsStatus.textContent = isJa ? '該当なし' : 'No results';
          } else if (hasMoreMatches) {
            libsStatus.textContent = isJa ? `${MAX_LIB_RESULTS}件を表示 (${refineLabel})` : `Showing ${MAX_LIB_RESULTS} results (${refineLabel})`;
          } else {
            libsStatus.textContent = isJa ? `${renderedCount}件` : `${renderedCount} item(s)`;
          }
          try { updateMismatches(); } catch (_) { }
        }
        libsQ.addEventListener('input', renderLibs);
        onlySel.addEventListener('change', renderLibs);
        if (libsCache === null) {
          catalogs.then(result => result.libraries).then(libraries => {
            libsCache = libraries;
            renderLibs(); updateSummary();
          }).catch(error => { libsCache = []; renderLibs(); setStatus(error.message, true); });
        } else { renderLibs(); }

        // Initial render
        updateSummary();

        async function updateMismatches() {
          const sequence = ++mismatchSequence;
          const text = yamlBox.value;
          if (!text.trim()) { mmBtn.disabled = true; return; }
          try {
            const checked = await requestTool('checkPreview', { text });
            if (sequence !== mismatchSequence || !yamlBox.isConnected || text !== yamlBox.value) return;
            const entries = checked.entries.filter(e => e.updateEligible && (e.status === 'outdated' || e.kind === 'library' && e.status === 'missing' || e.kind === 'platform' && ['outdated', 'missing'].includes(e.indexUrlStatus)));
            mmList.textContent = entries.map(e => `${e.name}: ${e.currentVersion || '-'} -> ${e.latestVersion}${e.kind === 'platform' && ['outdated', 'missing'].includes(e.indexUrlStatus) ? ' (platform_index_url)' : ''}`).join('\n');
            mmBtn.textContent = isJa ? '最新版へ更新' : 'Update to latest';
            mmBtn.disabled = entries.length === 0;
          } catch (error) {
            if (sequence === mismatchSequence && yamlBox.isConnected) { mmList.textContent = error.message; mmBtn.disabled = true; }
          }
        }
        mmBtn.addEventListener('click', async () => {
          dlBtn.disabled = true; mmBtn.disabled = true;
          const captured = yamlBox.value;
          const sequence = ++previewSequence;
          try {
            const updated = await requestTool('updatePreview', { text: captured });
            if (sequence !== previewSequence || !yamlBox.isConnected || yamlBox.value !== captured) return;
            yamlBox.value = updated.content; window.__WORKING_YAML__ = updated.content;
            selectedPlatformVersion = updated.platformVersion;
            selectedLibs.clear(); updated.libraries.forEach(l => selectedLibs.set(l.name, l.version));
            resetPlatformVersionOptions(selectedPlatformVersion);
            window.__INIT_STATE__.platformVersion = selectedPlatformVersion;
            refreshMetadataNote(); renderLibs(); updateMismatches(); dlBtn.disabled = false;
          } catch (error) { setStatus(error.message, true); }
        });
      }

      const handleFilterTrigger = () => {
        try { if (!window.__INIT_PENDING__) window.__USER_CHANGED_OPTIONS__ = true; } catch (_) { }
        applyFilter();
      };
      q.addEventListener('input', handleFilterTrigger);
      q.addEventListener('change', handleFilterTrigger);
      q.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') {
          try { if (!window.__INIT_PENDING__) window.__USER_CHANGED_OPTIONS__ = true; } catch (_) { }
          applyFilter();
        }
      });

      // Load data
      catalogs.then(result => {
        if (result.warnings.length) setStatus(result.warnings.join('\n'), true);
        return result.boards;
      })
        .then(json => {
          render(json);
          applyFilter();
        })
        .catch(err => {
          list.innerHTML = '';
          const li = document.createElement('li');
          li.className = 'empty';
          li.textContent = IS_JA_LOCALE ? 'カタログを取得できませんでした。' : 'Could not load the catalog.';
          list.appendChild(li);
          setStatus(`Load error: ${err.message}`, true);
        });

      // VS Code integration: preselect board options and libraries from current profile
      window.addEventListener('message', (ev) => {
        const data = ev && ev.data || {};
        if (!data || data.type !== 'init') return;
        try {
          window.__ALLOW_LIB_PATCH__ = false;
          // Store initial platform info
          window.__INIT_STATE__ = { platformId: String(data.platformId || ''), platformVersion: String(data.platformVersion || '') };
          try { window.__INIT_PLATFORM_INDEX_URL__ = (typeof data.platformIndexUrl === 'string') ? data.platformIndexUrl : ''; } catch (_) { }
          // If a raw profile block is provided, remember it and try to inject into textarea later
          try { window.__INITIAL_PROFILE_BLOCK__ = (typeof data.profileBlock === 'string') ? data.profileBlock : ''; } catch (_) { }
          window.__METADATA_WARNING__ = data.metadataWarning; window.__LOCAL_CORE_LABEL__ = data.localCoreLabel;
          try { window.__PROFILE_NAME__ = String(data.profileName || ''); } catch (_) { }
          try { window.__INIT_EXTFQBN__ = String(data.extFqbn || ''); window.__CURRENT_EXTFQBN__ = window.__INIT_EXTFQBN__; } catch (_) { }
          const extFqbn = String(data.extFqbn || '');
          if (!extFqbn) return;
          // Base FQBN is vendor:arch:board (first 3 segments)
          const parts = extFqbn.split(':');
          const baseFqbn = parts.slice(0, 3).join(':');
          const pairsText = parts.slice(3).join(':');
          q.value = baseFqbn;
          try { window.__CURRENT_BASEFQBN__ = baseFqbn; } catch (_) { }
          applyFilter();
          // Parse and store option selections for application after config renders
          window.__OPT_PAIRS = null;
          if (pairsText) {
            const pairs = [];
            pairsText.split(',').map(s => s.trim()).filter(Boolean).forEach(p => {
              const kv = p.split('=');
              if (kv.length < 2) return;
              const key = kv[0];
              const val = kv.slice(1).join('=');
              pairs.push({ key, val });
            });
            if (pairs.length) window.__OPT_PAIRS = pairs;
          }
          // Apply libraries selection
          if (Array.isArray(data.libraries)) {
            selectedLibs.clear();
            data.libraries.forEach(row => {
              const name = (row && row.name) ? String(row.name) : '';
              const ver = (row && row.version) ? String(row.version) : '';
              if (name) selectedLibs.set(name, ver ? ver : '');
            });
            // If library list already loaded, re-render and update summary
            try { if (libsCache !== null) { renderLibs(); } } catch (_) { }
            // Avoid overwriting provided YAML block; only refresh mismatches/summary text
            try {
              const hadInitial = !!(window.__INITIAL_PROFILE_BLOCK__);
              if (!hadInitial) updateSummary();
            } catch (_) { }
            try { if (typeof updateMismatches === 'function') updateMismatches(); } catch (_) { }
          }
        } catch (_) { /* ignore */ }
      });
    })();
  </script>
</body>
